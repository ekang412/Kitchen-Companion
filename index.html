    .icon-btn{background:rgba(255,255,255,0.15);border:none;color:white;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:18px;position:relative;transition:background 0.2s}

    .tab.active{color:#2d8a4e;border-bottom-color:#2d8a4e;background:#f2f8f3}

    .content{max-width:920px;margin:0 auto;padding:20px 16px}

    .alert-title{font-weight:700;font-size:13px;margin-bottom:6px}

    .section-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}

    .inv-item{background:white;border:2px solid #ebebeb;border-radius:12px;padding:14px;transition:border-color 0.2s}
    .inv-item.low{border-color:#f4a226}
    .inv-item.critical{border-color:#e74c3c}
    .inv-name{font-weight:700;font-size:14px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .inv-qty{font-size:12px;color:#777;margin-bottom:8px}
    .prog-bar{height:5px;background:#eee;border-radius:3px;overflow:hidden;margin-bottom:6px}
    .prog-fill{height:100%;border-radius:3px;transition:width 0.4s}
    .inv-pct{font-size:11px;font-weight:700;margin-bottom:8px}
    .inv-actions{display:flex;gap:5px}
    .btn-xs{padding:3px 9px;font-size:11px;border-radius:6px;border:none;cursor:pointer;font-weight:600}
    .btn-edit{background:#e8f0e9;color:#2d8a4e}
    .btn-del{background:#fde8e8;color:#c0392b}
    .add-item-card{background:white;border:2px dashed #d0d0d0;border-radius:12px;padding:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;color:#999;font-size:13px;font-weight:600;gap:6px;min-height:100px;flex-direction:column}
    .add-item-card:hover{border-color:#2d8a4e;color:#2d8a4e;background:#f5fbf6}
    .btn{padding:10px 20px;border-radius:8px;border:none;cursor:pointer;font-weight:700;font-size:14px;transition:all 0.2s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
    .btn:disabled{opacity:0.5;cursor:not-allowed}
    .btn-primary{background:#2d8a4e;color:white}
    .btn-primary:hover:not(:disabled){background:#1a5c34}
    .btn-secondary{background:#f0f0f0;color:#444}
    .btn-secondary:hover:not(:disabled){background:#e0e0e0}
    .btn-orange{background:#f4a226;color:white}
    .btn-orange:hover:not(:disabled){background:#d4891a}
    .btn-full{width:100%;padding:14px;font-size:15px;margin-top:12px}
    .btn-scan{background:linear-gradient(135deg,#667eea,#764ba2);color:white}
    .fraction-row{display:flex;gap:6px;flex-wrap:wrap}
    .frac-btn{padding:8px 12px;border-radius:8px;border:2px solid #e0e0e0;cursor:pointer;font-size:13px;font-weight:700;transition:all 0.2s;background:white}
    .frac-btn.sel{border-color:#2d8a4e;background:#e8f0e9;color:#1a5c34}
    .container-row{display:flex;gap:6px;flex-wrap:wrap}
    .cont-btn{padding:6px 12px;border-radius:8px;border:2px solid #e0e0e0;cursor:pointer;font-size:12px;font-weight:600;transition:all 0.2s;background:white}
    .cont-btn.sel{border-color:#2d8a4e;background:#e8f0e9;color:#1a5c34}
    .filter-section{background:white;border-radius:12px;padding:18px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
    .filter-label{font-size:12px;font-weight:700;color:#555;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px}
    .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
    .chip{padding:7px 14px;border-radius:20px;border:2px solid #e0e0e0;cursor:pointer;font-size:13px;font-weight:600;transition:all 0.2s;background:white}
    .chip.active-green{border-color:#2d8a4e;background:#e8f0e9;color:#2d8a4e}
    .chip.active-red{border-color:#e74c3c;background:#fde8e8;color:#e74c3c}
    .chip.active-blue{border-color:#3498db;background:#e8f3fb;color:#3498db}
    .chip.active-purple{border-color:#8e44ad;background:#f4e8ff;color:#8e44ad}
    .chip.active-teal{border-color:#16a085;background:#e8f8f5;color:#16a085}
    .recipe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
    .recipe-card{background:white;border-radius:14px;padding:18px;cursor:pointer;transition:all 0.2s;border:2px solid transparent;box-shadow:0 2px 8px rgba(0,0,0,0.07)}
    .recipe-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,0.12)}
    .rc-emoji{font-size:42px;margin-bottom:10px;display:block}
    .rc-name{font-weight:700;font-size:15px;margin-bottom:6px}
    .rc-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
    .tag{padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700}
    .tag-g{background:#e8f0e9;color:#2d8a4e}
    .tag-o{background:#fff3e0;color:#e67e22}
    .tag-b{background:#e8f3fb;color:#2980b9}
    .tag-r{background:#fde8e8;color:#c0392b}
    .tag-p{background:#f4e8ff;color:#8e44ad}
    .tag-t{background:#e8f8f5;color:#16a085}
    .rc-match{font-size:11px;color:#999;display:flex;align-items:center;gap:4px}
    .match-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
    .modal{background:white;border-radius:18px;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;padding:28px;position:relative;animation:popIn 0.25s ease}
    .modal.wide{max-width:740px}
    @keyframes popIn{from{opacity:0;transform:scale(0.94)}to{opacity:1;transform:scale(1)}}
    .modal-close{position:absolute;top:16px;right:16px;background:#f0f0f0;border:none;font-size:18px;cursor:pointer;color:#555;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center}
    .modal-close:hover{background:#e0e0e0}
    .form-group{margin-bottom:14px}
    .form-label{display:block;font-size:13px;font-weight:700;margin-bottom:5px;color:#555}
    .form-input{width:100%;padding:10px 13px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none;transition:border-color 0.2s}
    .form-input:focus{border-color:#2d8a4e}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .form-select{width:100%;padding:10px 13px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none;background:white;cursor:pointer}
    .form-select:focus{border-color:#2d8a4e}
    .form-hint{font-size:11px;color:#999;margin-top:4px}
    .scale-row{display:flex;gap:8px;flex-wrap:wrap}
    .scale-btn{flex:1;min-width:60px;padding:10px 6px;border:2px solid #e8e8e8;border-radius:10px;cursor:pointer;text-align:center;font-weight:700;font-size:13px;transition:all 0.2s}
    .scale-btn.sel{border-color:#2d8a4e;background:#e8f0e9;color:#1a5c34}
    .check-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .check-item{padding:10px 12px;border:2px solid #e8e8e8;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;transition:all 0.2s;display:flex;align-items:center;gap:8px}

    .rd-header{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
    .rd-emoji{font-size:56px;line-height:1}
    .rd-info h2{font-size:21px;font-weight:800;margin-bottom:8px}
    .rd-tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:6px}
    .rd-section{margin-top:18px}
    .rd-section-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;color:#555;margin-bottom:10px}
    .ing-list{list-style:none}
    .ing-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f5f5f5;font-size:14px}
    .ing-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .ing-dot.have{background:#2d8a4e}
    .ing-dot.missing{background:#e74c3c}
    .ing-dot.unknown{background:#bbb}
    .step-list{list-style:none}
    .step-item{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid #f5f5f5}
    .step-num{min-width:26px;height:26px;background:#2d8a4e;color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;margin-top:2px}
    .step-text{font-size:14px;line-height:1.55;color:#333}
    .missing-note{background:#fff8e6;border-radius:8px;padding:10px 14px;font-size:13px;color:#c07d00;margin-top:12px}
    .history-item{display:flex;align-items:center;gap:16px;padding:16px;border-bottom:1px solid #f0f0f0}
    .history-item:last-child{border-bottom:none}
    .hi-emoji{font-size:34px}
    .hi-info{flex:1}
    .hi-name{font-weight:700;font-size:15px}
    .hi-date{font-size:12px;color:#999;margin-top:2px}
    .hi-badge{font-size:11px;font-weight:700;color:#2d8a4e;text-transform:uppercase;letter-spacing:0.5px;margin-top:2px}

    .scan-drop:hover{border-color:#2d8a4e;background:#f5fbf6}
    .scan-preview{width:100%;max-height:260px;object-fit:contain;border-radius:10px;margin-bottom:16px;background:#f0f0f0}

    @keyframes spin{to{transform:rotate(360deg)}}

    @keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .toast.warning{background:#e67e22}
    .empty{text-align:center;padding:48px 20px;color:#aaa}
    .empty-icon{font-size:52px;margin-bottom:12px}
    .empty-text{font-size:15px}
    .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700}
    .badge-green{background:#e8f0e9;color:#2d8a4e}
    .time-grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:8px}
    .time-card{background:white;border:3px solid #e8e8e8;border-radius:14px;padding:18px 22px;cursor:pointer;transition:all 0.2s;text-align:center;min-width:90px}
    .time-card:hover{border-color:#2d8a4e;background:#f5fbf6}
    .time-card-icon{font-size:28px;margin-bottom:6px}
    .time-card-label{font-weight:800;font-size:16px;color:#333}
    .time-card-sub{font-size:11px;color:#999;margin-top:2px}
    /* Member card */
    .member-card{background:#f8f8f8;border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:8px}
    .member-avatar{width:36px;height:36px;border-radius:50%;background:#2d8a4e;color:white;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
    .member-info{flex:1}
    .member-name{font-weight:700;font-size:14px}
    .member-email{font-size:12px;color:#888}
    /* Household setup */
    .setup-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#f5fbf6 0%,#faf7f2 60%,#fff9ef 100%)}
    .setup-card{background:white;border-radius:20px;padding:36px;max-width:460px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,0.1)}
    /* Loading */
    .loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;color:#2d8a4e;font-size:16px;font-weight:600}
    @media(max-width:600px){.recipe-grid{grid-template-columns:1fr 1fr}.form-row{grid-template-columns:1fr}.check-grid{grid-template-columns:1fr}.header h1{font-size:18px}.modal{padding:20px}}
    @media(max-width:380px){.recipe-grid{grid-template-columns:1fr}}
  </style>
</head>

// ─── UTILITIES ───────────────────────────────
function fracLabel(f){ return f===1?'Full':f===0.75?'¾':f===0.5?'½':'¼'; }
function stockColor(f){ return f<=0.10?'#e74c3c':f<=0.25?'#f4a226':'#2d8a4e'; }
function stockClass(f){ return f<=0.10?'critical':f<=0.25?'low':''; }
function nameMatch(invName,ingName){
  const n=invName.toLowerCase(),k=ingName.toLowerCase();
  return n.includes(k)||k.includes(n)||
    (k.includes('pasta')&&(n.includes('spaghetti')||n.includes('pasta')||n.includes('noodle')))||
    (k.includes('noodle')&&(n.includes('noodle')||n.includes('pasta')||n.includes('ramen')))||
    (k.includes('chicken')&&n.includes('chicken'))||
    (k.includes('tomato')&&n.includes('tomato'))||
    (k.includes('cheese')&&n.includes('cheese'))||
    (k.includes('broth')&&(n.includes('broth')||n.includes('stock')))||
    (k.includes('oil')&&n.includes('oil'))||
    (k.includes('bean')&&n.includes('bean'));
}
function matchRecipe(recipe,inventory){
  let have=0;const missing=[];
  recipe.ingredients.forEach(ing=>{
    const m=inventory.find(i=>nameMatch(i.name,ing.name)&&i.frac>0);
    if(m) have++;
    else missing.push(ing.name);
  });
  return{pct:have/recipe.ingredients.length,missing,have,total:recipe.ingredients.length};
}
function getLowStock(inv){ return inv.filter(i=>i.frac<=0.25); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function getCurrentMonth(){ const d=new Date();return`${d.getFullYear()}-${d.getMonth()+1}`; }
function formatDate(iso){ return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function formatMonth(iso){ const[y,m]=iso.split('-');return new Date(y,m-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'}); }
function initials(name){ return name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2); }
async function fileToBase64(file){ return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file);}); }
async function analyzeImageWithClaude(base64,mimeType,apiKey){
  const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'x-api-key':apiKey,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:1024,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:mimeType,data:base64}},{type:'text',text:'List every food item you see. Return ONLY a JSON array: [{"name":"Pasta","container":"bag"},...]. Container types: bag, box, can, bottle, carton, jar, package, container, bunch, loaf.'}]}]})});
  if(!resp.ok){const e=await resp.json();throw new Error(e.error?.message||'API error');}
  const data=await resp.json();
  const match=data.content[0].text.match(/\[[\s\S]*\]/);
  if(!match) throw new Error('Could not parse response');
  return JSON.parse(match[0]);
}

// ─── HOUSEHOLD SETUP ─────────────────────────
function HouseholdSetup({onSetup}){
  const [name,setName]=useState('');
  function handleJoin(){
    if(!name.trim()) return;
    const id=name.trim().toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');

    onSetup(id);

  return(
    <div className="setup-wrap">
      <div className="setup-card">
        <div style={{fontSize:'48px',marginBottom:'12px'}}>🏠</div>

// ─── MAIN APP ─────────────────────────────────
function App(){
  const [householdId,setHouseholdId] = useState(()=>localStorage.getItem('kc_household'));
  const [loading,setLoading]         = useState(true);
  const [inventory,setInventory]     = useState([]);
  const [history,setHistory]         = useState([]);
  const [prefs,setPrefs]             = useState(DEFAULT_PREFS);
  const [members,setMembers]         = useState([]);
  const [apiKey,setApiKey]           = useState(()=>localStorage.getItem('kc_apikey')||'');
  const [tab,setTab]                 = useState('inventory');
  const [toast,setToast]             = useState(null);
  const [addModal,setAddModal]       = useState(null);
  const [recipeModal,setRecipeModal] = useState(null);
  const [alertsModal,setAlertsModal] = useState(false);
  const [scanModal,setScanModal]     = useState(false);
  const [settingsModal,setSettingsModal] = useState(false);
  const toastRef=useRef(null);

  // Connect to Firestore
  useEffect(()=>{
    if(!householdId){setLoading(false);return;}
    const hRef=db.collection('households').doc(householdId);
    // Check if new household
    hRef.get().then(doc=>{
      if(!doc.exists){
        hRef.set({prefs:DEFAULT_PREFS,members:[],createdAt:new Date().toISOString()});
        DEFAULT_INVENTORY.forEach(item=>hRef.collection('inventory').doc(item.id).set(item));
      }
    });
    // Live listeners
    const unsubH=hRef.onSnapshot(doc=>{
      if(doc.exists){const d=doc.data();if(d.prefs)setPrefs({...DEFAULT_PREFS,...d.prefs});if(d.members)setMembers(d.members);}
    });
    const unsubI=hRef.collection('inventory').onSnapshot(snap=>{
      setInventory(snap.docs.map(d=>({...d.data(),id:d.id})));
      setLoading(false);
    });
    const unsubHist=hRef.collection('history').onSnapshot(snap=>{
      setHistory(snap.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>b.date.localeCompare(a.date)));
    });
    return()=>{unsubH();unsubI();unsubHist();};
  },[householdId]);

  useEffect(()=>{localStorage.setItem('kc_apikey',apiKey);},[apiKey]);

  const showToast=useCallback((msg,type='')=>{
    clearTimeout(toastRef.current);setToast({msg,type});
    toastRef.current=setTimeout(()=>setToast(null),3800);
  },[]);

  const lowItems=useMemo(()=>getLowStock(inventory),[inventory]);

  function hRef(){ return db.collection('households').doc(householdId); }

  function saveItem(item){
    const id=item.id||uid();
    hRef().collection('inventory').doc(id).set({...item,id});
    setAddModal(null);
    showToast(item.id?'✅ Item updated!':'✅ Item added!');
  }
  function saveMultipleItems(items){
    items.forEach(item=>{const id=uid();hRef().collection('inventory').doc(id).set({...item,id});});
    showToast(`✅ Added ${items.length} item${items.length>1?'s':''} to inventory!`);
  }
  function deleteItem(id){
    hRef().collection('inventory').doc(id).delete();
    showToast('🗑️ Item removed.');
  }
  function cookRecipe(recipe){
    inventory.forEach(item=>{
      if(nameMatch(item.name,recipe.ingredients.find(i=>nameMatch(item.name,i.name))?.name||'')&&item.frac>0){
        hRef().collection('inventory').doc(item.id).update({frac:Math.max(0,+(item.frac-0.25).toFixed(2))});
      }
    });
    recipe.ingredients.forEach(ing=>{
      const item=inventory.find(i=>nameMatch(i.name,ing.name)&&i.frac>0);
      if(item) hRef().collection('inventory').doc(item.id).update({frac:Math.max(0,+(item.frac-0.25).toFixed(2))});
    });
    const month=getCurrentMonth();
    const isChallenge=!history.some(h=>h.month===month&&h.challenge);
    const entry={id:uid(),recipeId:recipe.id,name:recipe.name,emoji:recipe.emoji,date:new Date().toISOString(),month,challenge:isChallenge};
    hRef().collection('history').doc(entry.id).set(entry);
    setRecipeModal(null);
    showToast(`🍽️ "${recipe.name}" cooked! Inventory updated.`);
  }
  function savePrefsAndMembers(newPrefs,newMembers,newApiKey){
    hRef().update({prefs:newPrefs,members:newMembers});
    setApiKey(newApiKey);
    setSettingsModal(false);
    showToast('✅ Settings saved!');
  }

  if(!householdId) return <HouseholdSetup onSetup={id=>{setHouseholdId(id);setLoading(true);}}/>;
  if(loading) return <div className="loading-screen"><div className="spinner" style={{width:40,height:40,borderWidth:4}}/><div>Loading your kitchen...</div></div>;

  return(
    <div>
      <div className="header">
        <div>
          <h1>🍳 Kitchen Companion</h1>
          <div className="header-sub">🏠 {householdId.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}</div>
        </div>
        <div className="header-right">
          <button className="icon-btn" onClick={()=>setAlertsModal(true)} title="Stock alerts">
            🔔{lowItems.length>0&&<span className="bell-badge">{lowItems.length}</span>}
          </button>
          <button className="icon-btn" onClick={()=>setSettingsModal(true)} title="Settings">⚙️</button>
        </div>
      </div>
      <div className="tabs">
        {[['inventory','🧊 Inventory'],['recipes','🍽️ Recipes'],['history','📋 History']].map(([k,l])=>(
          <div key={k} className={`tab ${tab===k?'active':''}`} onClick={()=>setTab(k)}>{l}</div>
        ))}
      </div>
      <div className="content">
        {lowItems.length>0&&tab!=='history'&&(
          <div className={`alert-banner ${lowItems.some(i=>i.frac<=0.10)?'critical':''}`}>
            <div className="alert-title">{lowItems.some(i=>i.frac<=0.10)?'🚨':'⚠️'} Running Low</div>
            <div className="alert-items">{lowItems.map(i=>`${i.name} (${fracLabel(i.frac)} ${i.container})`).join(' · ')}</div>
          </div>
        )}
        {tab==='inventory'&&<InventoryTab inventory={inventory} onAdd={()=>setAddModal({item:null})} onEdit={item=>setAddModal({item})} onDelete={deleteItem} onScan={()=>setScanModal(true)}/>}
        {tab==='recipes'  &&<RecipeTab inventory={inventory} prefs={prefs} onSelect={r=>setRecipeModal(r)}/>}
        {tab==='history'  &&<HistoryTab history={history}/>}
      </div>
      {addModal    &&<AddItemModal existing={addModal.item} onSave={saveItem} onClose={()=>setAddModal(null)}/>}
      {recipeModal &&<RecipeDetailModal recipe={recipeModal} inventory={inventory} onCook={cookRecipe} onClose={()=>setRecipeModal(null)}/>}
      {alertsModal &&<AlertsModal items={lowItems} onClose={()=>setAlertsModal(false)}/>}
      {scanModal   &&<ScanModal apiKey={apiKey} onSave={saveMultipleItems} onClose={()=>setScanModal(false)}/>}
      {settingsModal&&<SettingsModal prefs={prefs} members={members} apiKey={apiKey} householdId={householdId} appUrl={window.location.href} onSave={savePrefsAndMembers} onClose={()=>setSettingsModal(false)} onChangeHousehold={()=>{localStorage.removeItem('kc_household');setHouseholdId(null);}}/>}
      {toast&&<div className={`toast ${toast.type}`}>{toast.msg}</div>}
    </div>
  );
}

// ─── SCAN MODAL ──────────────────────────────
function ScanModal({apiKey,onSave,onClose}){
  const [phase,setPhase]=useState('upload');
  const [imageUrl,setImageUrl]=useState(null);
  const [items,setItems]=useState([]);
  const [error,setError]=useState(null);
  const fileRef=useRef(null);

  async function handleFile(file){
    if(!file||!file.type.startsWith('image/')) return;
    setImageUrl(URL.createObjectURL(file));
    if(apiKey){
      setPhase('analyzing');
      try{
        const b64=await fileToBase64(file);
        const detected=await analyzeImageWithClaude(b64,file.type,apiKey);
        setItems(detected.map((it,i)=>({...it,id:i,frac:1.0,location:'pantry'})));
        setPhase('review');
      }catch(e){setError(e.message);setPhase('review');setItems([{id:0,name:'',container:'bag',frac:1.0,location:'pantry'}]);}
    }else{setPhase('review');setItems([{id:0,name:'',container:'bag',frac:1.0,location:'pantry'}]);}
  }

  function updateItem(id,key,val){setItems(prev=>prev.map(i=>i.id===id?{...i,[key]:val}:i));}
  function removeItem(id){setItems(prev=>prev.filter(i=>i.id!==id));}
  function addItem(){setItems(prev=>[...prev,{id:Date.now(),name:'',container:'bag',frac:1.0,location:'pantry'}]);}

  return(
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal wide">
        <button className="modal-close" onClick={onClose}>✕</button>
        <h2 style={{marginBottom:'6px'}}>📸 Scan Inventory Items</h2>
        <p style={{fontSize:'13px',color:'#888',marginBottom:'18px'}}>Photo a single item or a whole shelf — I'll identify everything.</p>
        {phase==='upload'&&(
          <>
            <div className="scan-drop" onClick={()=>fileRef.current.click()}>
              <div style={{fontSize:'48px',marginBottom:'12px'}}>📷</div>
              <div style={{fontWeight:700,fontSize:'15px',color:'#555',marginBottom:'6px'}}>Tap to take a photo or upload</div>
              <div style={{fontSize:'13px',color:'#999'}}>Works with a single item or a full pantry shelf</div>
            </div>
            <input ref={fileRef} type="file" accept="image/*" capture="environment" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])}/>
          </>
        )}
        {phase==='analyzing'&&(
          <div>
            <img src={imageUrl} className="scan-preview" alt="uploaded"/>
            <div style={{textAlign:'center',padding:'20px',color:'#666',fontSize:'15px',display:'flex',alignItems:'center',justifyContent:'center',gap:'12px'}}>
              <div className="spinner"/>Identifying items...
            </div>
          </div>
        )}
        {phase==='review'&&(
          <div>
            {imageUrl&&<img src={imageUrl} className="scan-preview" alt="uploaded"/>}
            {error&&<div className="missing-note">⚠️ {error} — enter items manually below.</div>}
            {!error&&apiKey&&items.length>0&&<div style={{fontWeight:700,fontSize:'13px',color:'#2d8a4e',marginBottom:'10px'}}>✅ Found {items.length} item{items.length>1?'s':''}! Confirm how much is left:</div>}
            {items.map(item=>(
              <div key={item.id} style={{background:'#f8f8f8',borderRadius:'12px',padding:'14px',marginBottom:'10px'}}>
                <div style={{display:'flex',gap:'8px',marginBottom:'10px'}}>
                  <input className="form-input" value={item.name} onChange={e=>updateItem(item.id,'name',e.target.value)} placeholder="Item name..." style={{flex:1,margin:0}}/>
                  <select className="form-select" value={item.container} onChange={e=>updateItem(item.id,'container',e.target.value)} style={{width:'120px'}}>
                    {CONTAINERS.map(c=><option key={c} value={c}>{c}</option>)}
                  </select>
                  <button style={{background:'none',border:'none',color:'#e74c3c',cursor:'pointer',fontSize:'18px'}} onClick={()=>removeItem(item.id)}>✕</button>
                </div>
                <div style={{display:'flex',gap:'16px',flexWrap:'wrap'}}>
                  <div>
                    <div className="form-label" style={{marginBottom:'6px'}}>How much is left?</div>
                    <div className="fraction-row">
                      {FRACTIONS.map(f=><div key={f.val} className={`frac-btn ${item.frac===f.val?'sel':''}`} onClick={()=>updateItem(item.id,'frac',f.val)}>
                        {f.val===1.0?'🆕 Full':f.val===0.75?'¾ left':f.val===0.5?'½ left':'¼ left'}
                      </div>)}
                    </div>
                  </div>
                  <div>
                    <div className="form-label" style={{marginBottom:'6px'}}>Location</div>
                    <select className="form-select" value={item.location} onChange={e=>updateItem(item.id,'location',e.target.value)} style={{width:'140px'}}>
                      <option value="fridge">🧊 Fridge</option>
                      <option value="freezer">❄️ Freezer</option>
                      <option value="pantry">🥫 Pantry</option>
                    </select>
                  </div>
                </div>
              </div>
            ))}
            <button className="btn btn-secondary" style={{marginBottom:'10px'}} onClick={addItem}>＋ Add another item</button>
            <button className="btn btn-secondary" style={{marginBottom:'10px',marginLeft:'8px'}} onClick={()=>{setPhase('upload');setImageUrl(null);setItems([]);}}>📷 New photo</button>
            <button className="btn btn-primary btn-full" onClick={()=>{onSave(items.filter(i=>i.name.trim()));onClose();}} disabled={items.filter(i=>i.name.trim()).length===0}>
              ✅ Add {items.filter(i=>i.name.trim()).length} item{items.filter(i=>i.name.trim()).length!==1?'s':''} to Inventory
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── RECIPE TAB ──────────────────────────────
function RecipeTab({inventory,prefs,onSelect}){
  const [step,setStep]           = useState(1);
  const [timeLimit,setTimeLimit] = useState(null);
  const [servings,setServings]   = useState(2);
  const [selectedIds,setSelectedIds] = useState([]);
  const [cuisineMood,setCuisineMood] = useState(null);

  const available=useMemo(()=>inventory.filter(i=>i.frac>0),[inventory]);
  function toggleItem(id){setSelectedIds(prev=>prev.includes(id)?prev.filter(x=>x!==id):[...prev,id]);}

  const top3=useMemo(()=>{
    if(step!==5) return [];
    const sel=available.filter(i=>selectedIds.includes(i.id));
    return RECIPES
      .filter(r=>r.minutes<=timeLimit&&(cuisineMood==='any'||r.cuisine===cuisineMood))
      .map(r=>{let hits=0;r.ingredients.forEach(ing=>{if(sel.some(i=>nameMatch(i.name,ing.name)))hits++;});return{...r,hits,match:matchRecipe(r,inventory)};})
      .filter(r=>r.hits>0)
      .sort((a,b)=>b.hits-a.hits||b.match.pct-a.match.pct)
      .slice(0,3);
  },[step,selectedIds,cuisineMood,timeLimit,inventory,available]);

  // Step 1: Time
  if(step===1) return(
    <div className="filter-section">
      <div style={{textAlign:'center',padding:'16px 0 8px'}}>
        <div style={{fontSize:'40px',marginBottom:'12px'}}>⏱️</div>
        <div style={{fontSize:'20px',fontWeight:800,color:'#1a5c34',marginBottom:'6px'}}>How much time do you have?</div>
        <div style={{fontSize:'14px',color:'#888',marginBottom:'24px'}}>I'll only recommend recipes you can actually finish.</div>
        <div className="time-grid">
          {TIMES.map(t=><div key={t.val} className="time-card" onClick={()=>{setTimeLimit(t.val);setStep(2);}}>
            <div className="time-card-icon">{t.icon}</div>
            <div className="time-card-label">{t.label}</div>
            <div className="time-card-sub">{t.sub}</div>
          </div>)}
        </div>
      </div>
    </div>
  );

  // Step 2: Servings
  if(step===2){
    const opts=[{n:1,emoji:'🧍',label:'Just me'},{n:2,emoji:'👫',label:'2 people'},{n:3,emoji:'👨‍👩‍👦',label:'3 people'},{n:4,emoji:'👨‍👩‍👧‍👦',label:'4 people'},{n:5,emoji:'🏠',label:'5 people'},{n:6,emoji:'🎉',label:'6+ people'}];
    return(
      <div className="filter-section">
        <div style={{textAlign:'center',padding:'16px 0 8px'}}>
          <div style={{fontSize:'40px',marginBottom:'12px'}}>👨‍🍳</div>
          <div style={{fontSize:'20px',fontWeight:800,color:'#1a5c34',marginBottom:'6px'}}>How many people are you cooking for?</div>
          <div style={{fontSize:'14px',color:'#888',marginBottom:'24px'}}>I'll scale all ingredient amounts for you.</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'12px',maxWidth:'420px',margin:'0 auto'}}>
            {opts.map(o=><div key={o.n} className="time-card" style={servings===o.n?{borderColor:'#2d8a4e',background:'#e8f0e9',borderWidth:'3px'}:{}} onClick={()=>{setServings(o.n);setStep(3);}}>
              <div className="time-card-icon">{o.emoji}</div>
              <div className="time-card-label" style={{fontSize:'14px'}}>{o.label}</div>
            </div>)}
          </div>
          <button className="btn btn-secondary" style={{marginTop:'20px',padding:'8px 16px',fontSize:'13px'}} onClick={()=>setStep(1)}>← Change Time</button>
        </div>
      </div>
    );
  }

  // Step 3: Ingredients
  if(step===3){
    const byLoc=[['fridge','🧊 Fridge'],['freezer','❄️ Freezer'],['pantry','🥫 Pantry']];
    return(
      <div>
        <div className="filter-section">
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'6px'}}>
            <div style={{fontWeight:800,fontSize:'16px',color:'#1a5c34'}}>🛒 What do you want to cook with?</div>
            <button className="btn btn-secondary" style={{padding:'6px 12px',fontSize:'12px'}} onClick={()=>setStep(2)}>← Back</button>
          </div>
          <div style={{fontSize:'13px',color:'#888',marginBottom:'16px'}}>Tap items you'd like to use. I don't need to use all of them.</div>
          {byLoc.map(([loc,label])=>{
            const its=available.filter(i=>i.location===loc);
            if(!its.length) return null;
            return(
              <div key={loc} style={{marginBottom:'14px'}}>
                <div style={{fontSize:'12px',fontWeight:700,color:'#777',textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:'8px'}}>{label}</div>
                <div style={{display:'flex',flexWrap:'wrap',gap:'8px'}}>
                  {its.map(item=>{
                    const sel=selectedIds.includes(item.id);
                    return(
                      <div key={item.id} onClick={()=>toggleItem(item.id)} style={{padding:'8px 14px',borderRadius:'20px',cursor:'pointer',fontSize:'13px',fontWeight:600,border:`2px solid ${sel?'#2d8a4e':'#e0e0e0'}`,background:sel?'#e8f0e9':'white',color:sel?'#1a5c34':'#555',display:'flex',alignItems:'center',gap:'6px',transition:'all 0.15s'}}>
                        {sel&&<span style={{fontSize:'11px'}}>✓</span>}
                        {item.name}
                        <span style={{fontSize:'11px',opacity:0.7}}>{fracLabel(item.frac)}</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
          <div style={{borderTop:'1px solid #f0f0f0',paddingTop:'14px',marginTop:'6px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <div style={{fontSize:'13px',color:selectedIds.length>0?'#2d8a4e':'#888',fontWeight:selectedIds.length>0?700:400}}>
              {selectedIds.length===0?'No ingredients selected yet':`${selectedIds.length} ingredient${selectedIds.length>1?'s':''} selected`}
            </div>
            <button className="btn btn-primary" disabled={selectedIds.length===0} onClick={()=>setStep(4)} style={{padding:'10px 22px'}}>Next →</button>
          </div>
        </div>
      </div>
    );
  }

  // Step 4: Cuisine mood
  if(step===4) return(
    <div>
      <div className="filter-section">
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'6px'}}>
          <div style={{fontWeight:800,fontSize:'16px',color:'#1a5c34'}}>🌍 What are you in the mood for?</div>
          <button className="btn btn-secondary" style={{padding:'6px 12px',fontSize:'12px'}} onClick={()=>setStep(3)}>← Back</button>
        </div>
        <div style={{fontSize:'13px',color:'#888',marginBottom:'20px'}}>Pick a cuisine — or let me surprise you.</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(130px,1fr))',gap:'10px'}}>
          {CUISINE_MOODS.map(c=>(
            <div key={c.id} onClick={()=>{setCuisineMood(c.id);setStep(5);}} style={{background:'white',border:'2px solid #e8e8e8',borderRadius:'14px',padding:'16px 10px',textAlign:'center',cursor:'pointer',transition:'all 0.18s'}}
              onMouseEnter={e=>{e.currentTarget.style.borderColor='#2d8a4e';e.currentTarget.style.background='#f5fbf6';}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor='#e8e8e8';e.currentTarget.style.background='white';}}>
              <div style={{fontSize:'32px',marginBottom:'8px'}}>{c.emoji}</div>
              <div style={{fontWeight:700,fontSize:'14px',color:'#333'}}>{c.label}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );

  // Step 5: Results
  const selectedNames=available.filter(i=>selectedIds.includes(i.id)).map(i=>i.name);
  const cuisineLabel=CUISINE_MOODS.find(c=>c.id===cuisineMood);
  return(
    <div>
      <div className="filter-section" style={{marginBottom:'16px',padding:'14px 18px'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:'8px'}}>
          <div>
            <div style={{fontWeight:800,fontSize:'15px',color:'#1a5c34',marginBottom:'3px'}}>{cuisineLabel?.emoji} Your 3 {cuisineLabel?.id==='any'?'':cuisineLabel?.label+' '}Picks</div>
            <div style={{fontSize:'12px',color:'#888'}}>⏱️ {timeLimit} min · 👥 {servings} {servings===1?'person':'people'} · {selectedNames.slice(0,3).join(', ')}{selectedNames.length>3?` +${selectedNames.length-3} more`:''}</div>
          </div>
          <div style={{display:'flex',gap:'8px',flexWrap:'wrap'}}>
            <button className="btn btn-secondary" style={{padding:'7px 12px',fontSize:'12px'}} onClick={()=>setStep(4)}>← Cuisine</button>
            <button className="btn btn-secondary" style={{padding:'7px 12px',fontSize:'12px'}} onClick={()=>{setStep(1);setSelectedIds([]);setTimeLimit(null);setCuisineMood(null);setServings(2);}}>Start Over</button>
          </div>
        </div>
      </div>
      {top3.length===0?(
        <div className="empty">
          <div className="empty-icon">🤔</div>
          <div className="empty-text">No {cuisineLabel?.id!=='any'?cuisineLabel?.label+' ':''}recipes matched in {timeLimit} min.</div>
          <div style={{display:'flex',gap:'10px',justifyContent:'center',marginTop:'16px',flexWrap:'wrap'}}>
            <button className="btn btn-primary" onClick={()=>setStep(4)}>Try Different Cuisine</button>
            <button className="btn btn-secondary" onClick={()=>setStep(3)}>Change Ingredients</button>
          </div>
        </div>
      ):(
        <div style={{display:'flex',flexDirection:'column',gap:'16px'}}>
          {top3.map((r,idx)=><RecipeCard key={r.id} recipe={r} rank={idx+1} selectedNames={selectedNames} servings={servings} onClick={()=>onSelect({...r,servings})}/>)}
          {top3.length<3&&<div style={{textAlign:'center',fontSize:'13px',color:'#aaa',padding:'8px'}}>Only {top3.length} recipe{top3.length>1?'s':''} matched — try different cuisine or more ingredients.</div>}
        </div>
      )}
    </div>
  );
}

function RecipeCard({recipe,rank,selectedNames,servings,onClick}){
  const {match}=recipe,hits=recipe.hits||0,canMake=match.pct===1;
  const rankColors=['#f4a226','#2d8a4e','#8e44ad'];
  const rankLabels=['#1 Pick','#2 Pick','#3 Pick'];
  const usedIngredients=recipe.ingredients.filter(ing=>selectedNames&&selectedNames.some(n=>nameMatch(n,ing.name))).map(i=>i.name);
  return(
    <div style={{background:'white',borderRadius:'14px',padding:'18px',cursor:'pointer',border:`2px solid ${rankColors[(rank||1)-1]}`,boxShadow:'0 2px 10px rgba(0,0,0,0.08)',transition:'all 0.2s'}} onClick={onClick}
      onMouseEnter={e=>e.currentTarget.style.transform='translateY(-2px)'}
      onMouseLeave={e=>e.currentTarget.style.transform='translateY(0)'}>
      <div style={{display:'flex',alignItems:'flex-start',gap:'14px'}}>
        <div style={{textAlign:'center',flexShrink:0}}>
          <div style={{background:rankColors[(rank||1)-1],color:'white',borderRadius:'8px',padding:'3px 8px',fontSize:'11px',fontWeight:800,marginBottom:'6px'}}>{rankLabels[(rank||1)-1]}</div>
          <div style={{fontSize:'44px',lineHeight:1}}>{recipe.emoji}</div>
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:800,fontSize:'16px',marginBottom:'8px'}}>{recipe.name}</div>
          <div style={{display:'flex',gap:'6px',flexWrap:'wrap',marginBottom:'10px'}}>
            <span className="tag tag-b">{recipe.cuisine}</span>
            <span className="tag tag-g">⏱️ {recipe.minutes} min</span>
            {recipe.flavor.slice(0,2).map(f=><span key={f} className={`tag ${f==='spicy'?'tag-r':f==='sweet'?'tag-p':f==='umami'?'tag-t':'tag-o'}`}>{f}</span>)}
          </div>
          <div style={{fontSize:'12px',marginBottom:'6px'}}>
            <span style={{fontWeight:700,color:'#2d8a4e'}}>Uses {hits} of your ingredients: </span>
            <span style={{color:'#555'}}>{usedIngredients.slice(0,4).join(', ')}{usedIngredients.length>4?` +${usedIngredients.length-4} more`:''}</span>
          </div>
          {servings&&servings!==2&&<div style={{fontSize:'12px',color:'#8e44ad',fontWeight:700,marginBottom:'4px'}}>👥 Scaled for {servings} {servings===1?'person':'people'} · {servings>2?`×${(servings/2).toFixed(1).replace('.0','')} all amounts`:'use half all amounts'}</div>}
          <div style={{fontSize:'12px',color:'#999',display:'flex',alignItems:'center',gap:'5px'}}>
            <span style={{width:7,height:7,borderRadius:'50%',background:canMake?'#2d8a4e':'#f4a226',display:'inline-block',flexShrink:0}}/>
            {canMake?'✅ You have all ingredients!':match.missing.length>0?`May need: ${match.missing.slice(0,3).join(', ')}`:``}
          </div>
        </div>
        <div style={{fontSize:'20px',color:'#ccc',flexShrink:0,alignSelf:'center'}}>›</div>
      </div>
    </div>
  );
}

// ─── RECIPE DETAIL MODAL ─────────────────────
function RecipeDetailModal({recipe,inventory,onCook,onClose}){
  const match=matchRecipe(recipe,inventory);
  const servings=recipe.servings||2;
  const scale=servings/2;
  const scaleNote=scale===1?null:scale>1?`×${scale.toFixed(1).replace('.0','')} all ingredient amounts — scaled for ${servings} people`:`Use half of all ingredient amounts — scaled for 1 person`;
  return(
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <button className="modal-close" onClick={onClose}>✕</button>
        <div className="rd-header">
          <div className="rd-emoji">{recipe.emoji}</div>
          <div className="rd-info">
            <h2>{recipe.name}</h2>
            <div className="rd-tags">
              <span className="tag tag-b">{recipe.cuisine}</span>
              <span className="tag tag-g">⏱️ {recipe.minutes} min</span>
              <span className="tag tag-o">👨‍🍳 Beginner</span>
              {recipe.flavor.map(f=><span key={f} className={`tag ${f==='spicy'?'tag-r':f==='sweet'?'tag-p':f==='umami'?'tag-t':'tag-g'}`}>{f}</span>)}
            </div>
          </div>
        </div>
        {scaleNote&&<div style={{background:'#f3e8ff',borderRadius:'10px',padding:'11px 14px',fontSize:'13px',color:'#6d28d9',fontWeight:700,marginBottom:'16px'}}>👥 {scaleNote}</div>}
        <div className="rd-section">
          <div className="rd-section-title">🛒 Ingredients <span style={{fontWeight:400,color:'#999',fontSize:'11px',textTransform:'none',letterSpacing:0}}>base recipe serves 2{servings!==2?` · scaled for ${servings}`:''}</span></div>
          <ul className="ing-list">
            {recipe.ingredients.map((ing,i)=>{
              const inInv=inventory.some(item=>nameMatch(item.name,ing.name)&&item.frac>0);
              return(
                <li key={i} className="ing-item">
                  <span className={`ing-dot ${inInv?'have':'unknown'}`}/>
                  <span><strong>{ing.qty}</strong> {ing.name}</span>
                  {inInv&&<span style={{marginLeft:'auto',fontSize:'11px',color:'#2d8a4e',fontWeight:700}}>✓ have it</span>}
                </li>
              );
            })}
          </ul>
          {match.missing.length>0&&<div className="missing-note">⚠️ May be short on: {match.missing.join(', ')}. Check your pantry!</div>}
        </div>
        <div className="rd-section">
          <div className="rd-section-title">👨‍🍳 Step-by-Step Instructions</div>
          <ol className="step-list">
            {recipe.instructions.map((step,i)=>(
              <li key={i} className="step-item">
                <span className="step-num">{i+1}</span>
                <span className="step-text">{step}</span>
              </li>
            ))}
          </ol>
        </div>
        <button className="btn btn-primary btn-full" onClick={()=>onCook(recipe)}>🍽️ I Cooked This! — Deduct from Inventory</button>
      </div>
    </div>
  );
}

// ─── HISTORY TAB ─────────────────────────────
function HistoryTab({history}){
  if(!history.length) return <div className="empty"><div className="empty-icon">📖</div><div className="empty-text">No history yet. Make your first recipe!</div></div>;
  const byMonth={};
  history.forEach(h=>{if(!byMonth[h.month])byMonth[h.month]=[];byMonth[h.month].push(h);});
  return(
    <div>
      {Object.entries(byMonth).sort(([a],[b])=>b.localeCompare(a)).map(([month,entries])=>(
        <div key={month} style={{background:'white',borderRadius:'12px',marginBottom:'16px',overflow:'hidden',boxShadow:'0 2px 8px rgba(0,0,0,0.07)'}}>
          <div style={{background:'#f2f8f3',padding:'12px 20px',borderBottom:'1px solid #e8ede9',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <div style={{fontWeight:800,fontSize:'15px',color:'#1a5c34'}}>{formatMonth(month)}</div>
            <span className="badge badge-green">🍽️ {entries.length} meal{entries.length>1?'s':''}</span>
          </div>
          {entries.map(h=>(
            <div key={h.id} className="history-item">
              <div className="hi-emoji">{h.emoji}</div>
              <div className="hi-info">
                <div className="hi-name">{h.name}</div>
                <div className="hi-date">{formatDate(h.date)}</div>
                {h.challenge&&<div className="hi-badge">⭐ Monthly Challenge Pick</div>}
              </div>
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

// ─── ALERTS MODAL ────────────────────────────
function AlertsModal({items,onClose}){
  return(
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <button className="modal-close" onClick={onClose}>✕</button>
        <h2>🔔 Stock Alerts</h2>
        {items.length===0?(
          <div className="empty" style={{padding:'24px 0'}}><div className="empty-icon">✅</div><div className="empty-text">Everything is well stocked!</div></div>
        ):(
          <div style={{marginTop:'16px'}}>
            {items.map(item=>(
              <div key={item.id} style={{display:'flex',alignItems:'center',gap:'14px',padding:'14px',borderBottom:'1px solid #f5f5f5'}}>
                <div style={{fontSize:'24px'}}>{item.frac<=0.10?'🚨':'⚠️'}</div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:'15px'}}>{item.name}</div>
                  <div style={{fontSize:'12px',color:'#888'}}>{fracLabel(item.frac)} {item.container} left · {item.location}</div>
                  <div className="prog-bar" style={{marginTop:'6px'}}><div className="prog-fill" style={{width:`${item.frac*100}%`,background:stockColor(item.frac)}}/></div>
                </div>
                <div style={{fontWeight:800,color:stockColor(item.frac),fontSize:'15px'}}>{Math.round(item.frac*100)}%</div>
              </div>
            ))}
          </div>
        )}
        <button className="btn btn-secondary" style={{width:'100%',marginTop:'16px'}} onClick={onClose}>Close</button>
      </div>
    </div>
  );
}

// ─── SETTINGS MODAL ──────────────────────────
function SettingsModal({prefs,members,apiKey,householdId,appUrl,onSave,onClose,onChangeHousehold}){
  const [data,setData]=useState({...prefs});
  const [mems,setMems]=useState([...members]);
  const [key,setKey]=useState(apiKey);
  const [showKey,setShowKey]=useState(false);
  const [newName,setNewName]=useState('');
  const [newEmail,setNewEmail]=useState('');
  const cuisineOpts=['🇺🇸 American','🇮🇹 Italian','🇲🇽 Mexican','🇯🇵 Asian','🇬🇷 Mediterranean','🌍 All cuisines'];
  function toggle(field,val){setData(d=>{const a=d[field];return{...d,[field]:a.includes(val)?a.filter(x=>x!==val):[...a,val]};});}
  function addMember(){
    if(!newName.trim()||!newEmail.trim()) return;
    setMems(prev=>[...prev,{name:newName.trim(),email:newEmail.trim()}]);
    setNewName('');setNewEmail('');
  }
  function removeMember(i){setMems(prev=>prev.filter((_,j)=>j!==i));}
  function invite(m){
    const subject=encodeURIComponent('Join our Kitchen Companion!');
    const body=encodeURIComponent(`Hey ${m.name}!\n\nI've set up Kitchen Companion for our household. Open this link and enter the household name "${householdId.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}" to share our live inventory:\n\n${appUrl}\n\nSee you in the kitchen! 🍳`);
    window.location.href=`mailto:${m.email}?subject=${subject}&body=${body}`;
  }
  return(
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <button className="modal-close" onClick={onClose}>✕</button>
        <h2 style={{marginBottom:'20px'}}>⚙️ Settings</h2>

        {/* Household */}
        <div style={{background:'#e8f0e9',borderRadius:'10px',padding:'12px 14px',marginBottom:'20px'}}>
          <div style={{fontWeight:700,fontSize:'13px',color:'#1a5c34',marginBottom:'2px'}}>🏠 Household: {householdId.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}</div>
          <div style={{fontSize:'12px',color:'#555'}}>Share this name with family members so they can join.</div>
          <button style={{marginTop:'8px',fontSize:'12px',color:'#e74c3c',background:'none',border:'none',cursor:'pointer',padding:0,fontWeight:600}} onClick={onChangeHousehold}>Switch to different household</button>
        </div>

        {/* Household Members */}
        <div className="form-group">
          <label className="form-label">👨‍👩‍👧‍👦 Household Members</label>
          {mems.map((m,i)=>(
            <div key={i} className="member-card">
              <div className="member-avatar">{initials(m.name)}</div>
              <div className="member-info">
                <div className="member-name">{m.name}</div>
                <div className="member-email">{m.email}</div>
              </div>
              <button onClick={()=>invite(m)} style={{padding:'6px 12px',background:'#e8f0e9',color:'#2d8a4e',border:'none',borderRadius:'6px',cursor:'pointer',fontSize:'12px',fontWeight:700}}>📧 Invite</button>
              <button onClick={()=>removeMember(i)} style={{padding:'6px 10px',background:'#fde8e8',color:'#c0392b',border:'none',borderRadius:'6px',cursor:'pointer',fontSize:'12px'}}>🗑️</button>
            </div>
          ))}
          <div style={{display:'flex',gap:'8px',marginTop:'8px',flexWrap:'wrap'}}>
            <input className="form-input" value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Name" style={{flex:'1',minWidth:'100px'}}/>
            <input className="form-input" value={newEmail} onChange={e=>setNewEmail(e.target.value)} placeholder="Email address" style={{flex:'2',minWidth:'140px'}}/>
            <button className="btn btn-primary" style={{padding:'10px 14px',whiteSpace:'nowrap'}} disabled={!newName.trim()||!newEmail.trim()} onClick={addMember}>+ Add</button>
          </div>
          <div className="form-hint">After adding, click 📧 Invite to send them the app link by email.</div>
        </div>

        <div style={{height:'1px',background:'#f0f0f0',margin:'16px 0'}}/>

        {/* API Key */}
        <div className="form-group">
          <label className="form-label">🤖 Claude API Key <span style={{fontWeight:400,color:'#999'}}>(for photo scanning)</span></label>
          <div style={{display:'flex',gap:'8px'}}>
            <input className="form-input" type={showKey?'text':'password'} value={key} onChange={e=>setKey(e.target.value)} placeholder="sk-ant-..." style={{flex:1}}/>
            <button className="btn btn-secondary" style={{padding:'10px 14px',flexShrink:0}} onClick={()=>setShowKey(s=>!s)}>{showKey?'Hide':'Show'}</button>
          </div>
          <div className="form-hint">Get your key at console.anthropic.com — stored on your device only.</div>
        </div>

        <div style={{height:'1px',background:'#f0f0f0',margin:'16px 0'}}/>

        {/* Preferences */}
        <div className="form-group">
          <label className="form-label">Household Size</label>
          <div className="scale-row">{[1,2,3,4,'5+'].map(n=><div key={n} className={`scale-btn ${data.householdSize===n?'sel':''}`} onClick={()=>setData(d=>({...d,householdSize:n}))}>{n}</div>)}</div>
        </div>
        <div className="form-group">
          <label className="form-label">Favorite Cuisines</label>
          <div className="check-grid">{cuisineOpts.map(c=><div key={c} className={`check-item ${data.cuisines.includes(c)?'sel':''}`} onClick={()=>toggle('cuisines',c)}>{data.cuisines.includes(c)?'✅':'⬜'} {c}</div>)}</div>
        </div>
        <div className="form-group">
          <label className="form-label">Spice Level</label>
          <div className="scale-row">{[['mild','😌 Mild'],['medium','🙂 Medium'],['spicy','🌶️ Spicy'],['very_spicy','🔥 Hot']].map(([v,l])=><div key={v} className={`scale-btn ${data.spiceLevel===v?'sel':''}`} onClick={()=>setData(d=>({...d,spiceLevel:v}))}>{l}</div>)}</div>
        </div>
        <div style={{display:'flex',gap:'10px',marginTop:'8px'}}>
          <button className="btn btn-primary" style={{flex:1}} onClick={()=>onSave(data,mems,key)}>Save Changes</button>
          <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
