function ScanModal({apiKey,onSave,onClose}){
  const [phase,setPhase]       = useState('upload'); // upload | analyzing | review
  const [imageUrl,setImageUrl] = useState(null);
  const [imageBase64,setImageBase64] = useState(null);
  const [imageMime,setImageMime]     = useState(null);
  const [detectedItems,setDetectedItems] = useState([]);
  const [error,setError]       = useState(null);
  const [dragging,setDragging] = useState(false);
  const fileRef=useRef(null);

  async function handleFile(file){
    if(!file||!file.type.startsWith('image/')) return;
    setImageUrl(URL.createObjectURL(file));
    setImageMime(file.type);
    const b64=await fileToBase64(file);
    setImageBase64(b64);
    if(apiKey){
      setPhase('analyzing');
      setError(null);
      try{
        const items=await analyzeImageWithClaude(b64,file.type,apiKey);
        setDetectedItems(items.map((it,i)=>({...it,id:i,frac:1.0,location:'pantry',include:true})));
        setPhase('review');
      }catch(e){
        setError(e.message);
        setPhase('review');
        setDetectedItems([{id:0,name:'',container:'bag',frac:1.0,location:'pantry',include:true}]);
      }
    } else {
      setPhase('review');
      setDetectedItems([{id:0,name:'',container:'bag',frac:1.0,location:'pantry',include:true}]);
    }
  }

  function drop(e){ e.preventDefault(); setDragging(false); handleFile(e.dataTransfer.files[0]); }
  function updateItem(id,key,val){ setDetectedItems(prev=>prev.map(i=>i.id===id?{...i,[key]:val}:i)); }
  function removeItem(id){ setDetectedItems(prev=>prev.filter(i=>i.id!==id)); }
  function addItem(){ setDetectedItems(prev=>[...prev,{id:Date.now(),name:'',container:'bag',frac:1.0,location:'pantry',include:true}]); }
  function confirmSave(){
    const toSave=detectedItems.filter(i=>i.include&&i.name.trim());
    if(toSave.length===0) return;
    onSave(toSave.map(i=>({name:i.name.trim(),container:i.container,frac:i.frac,location:i.location})));
    onClose();
  }

  return(
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal wide">
        <button className="modal-close" onClick={onClose}>✕</button>
        <h2 style={{marginBottom:'6px'}}>📸 Scan Inventory Items</h2>
        <p style={{fontSize:'13px',color:'#888',marginBottom:'18px'}}>
          Take a photo of one item or an entire shelf — I'll identify everything and ask how much is left.
        </p>

        {!apiKey&&(
          <div className="api-key-note">
            💡 <strong>Tip:</strong> Add your Claude API key in ⚙️ Settings for automatic AI item detection.
            Without it, you'll enter items manually after uploading the photo.
          </div>
        )}

        {phase==='upload'&&(
          <>
            <div className={`scan-drop ${dragging?'drag':''}`}
              onClick={()=>fileRef.current.click()}
              onDragOver={e=>{e.preventDefault();setDragging(true);}}
              onDragLeave={()=>setDragging(false)}
              onDrop={drop}>
              <div className="scan-drop-icon">📷</div>
              <div className="scan-drop-text">Tap to take a photo or upload</div>
              <div className="scan-drop-sub">Works with a single item or a full pantry shelf</div>
            </div>
            <input ref={fileRef} type="file" accept="image/*" capture="environment" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])} />
          </>
        )}

        {phase==='analyzing'&&(
          <div>
            <img src={imageUrl} className="scan-preview" alt="uploaded"/>
            <div className="loading-pulse"><div className="spinner"/>Identifying food items in your photo...</div>
          </div>
        )}

        {phase==='review'&&(
          <div>
            {imageUrl&&<img src={imageUrl} className="scan-preview" alt="uploaded"/>}
            {error&&<div className="missing-note">⚠️ {error} — please enter items manually below.</div>}
            {detectedItems.length>0&&!error&&apiKey&&(
              <div style={{fontWeight:700,fontSize:'13px',color:'#2d8a4e',marginBottom:'10px'}}>
                ✅ Found {detectedItems.length} item{detectedItems.length>1?'s':''}! Confirm how much is left in each:
              </div>
            )}
            {(!apiKey||detectedItems.length===0||error)&&(
              <div style={{fontWeight:700,fontSize:'13px',color:'#555',marginBottom:'10px'}}>
                Enter items you see in the photo:
              </div>
            )}

            {detectedItems.map(item=>(
              <div key={item.id} style={{background:'#f8f8f8',borderRadius:'12px',padding:'14px',marginBottom:'12px'}}>
                <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'10px'}}>
                  <input
                    className="form-input"
                    value={item.name}
                    onChange={e=>updateItem(item.id,'name',e.target.value)}
                    placeholder="Item name..."
                    style={{flex:1,margin:0}}
                  />
                  <select className="form-select" value={item.container} onChange={e=>updateItem(item.id,'container',e.target.value)} style={{width:'120px'}}>
                    {CONTAINERS.map(c=><option key={c} value={c}>{c}</option>)}
                  </select>
                  <button className="scan-remove" onClick={()=>removeItem(item.id)} title="Remove">✕</button>
                </div>
                <div style={{display:'flex',gap:'16px',alignItems:'center',flexWrap:'wrap'}}>
                  <div>
                    <div className="form-label" style={{marginBottom:'6px'}}>How much is left?</div>
                    <div className="fraction-row">
                      {FRACTIONS.map(f=><div key={f.val} className={`frac-btn ${item.frac===f.val?'sel':''}`} onClick={()=>updateItem(item.id,'frac',f.val)}>
                        {f.val===1.0?'🆕 Full':f.val===0.75?'¾ left':f.val===0.5?'½ left':'¼ left'}
                      </div>)}
                    </div>
                  </div>
                  <div>
                    <div className="form-label" style={{marginBottom:'6px'}}>Location</div>
                    <select className="form-select" value={item.location} onChange={e=>updateItem(item.id,'location',e.target.value)} style={{width:'140px'}}>
                      <option value="fridge">🧊 Fridge</option>
                      <option value="freezer">❄️ Freezer</option>
                      <option value="pantry">🥫 Pantry</option>
                    </select>
                  </div>
                </div>
              </div>
            ))}

            <button className="btn btn-secondary" style={{marginBottom:'12px'}} onClick={addItem}>＋ Add another item</button>
            <br/>

            {phase!=='upload'&&(
              <button className="btn btn-secondary" style={{marginBottom:'12px',marginRight:'8px'}} onClick={()=>{setPhase('upload');setImageUrl(null);setDetectedItems([]);}}>
                📷 Scan different photo
              </button>
            )}

            <button
              className="btn btn-primary btn-full"
              onClick={confirmSave}
              disabled={detectedItems.filter(i=>i.name.trim()).length===0}
            >
              ✅ Add {detectedItems.filter(i=>i.name.trim()).length} item{detectedItems.filter(i=>i.name.trim()).length!==1?'s':''} to Inventory
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// Cuisine options for the mood picker
const CUISINE_MOODS = [
  {id:'American',    emoji:'🇺🇸', label:'American'},
  {id:'Italian',     emoji:'🇮🇹', label:'Italian'},
  {id:'Mexican',     emoji:'🇲🇽', label:'Mexican'},
  {id:'Asian',       emoji:'🇯🇵', label:'Asian'},
  {id:'Mediterranean',emoji:'🇬🇷',label:'Greek / Med'},
  {id:'Indian',      emoji:'🇮🇳', label:'Indian'},
  {id:'any',         emoji:'🌍',  label:'Surprise Me!'},
];

// ─────────────────────────────────────────────
// RECIPE TAB  — 4-step flow
//   Step 1: How much time?
//   Step 2: Pick ingredients from your inventory
//   Step 3: Pick ingredients from your inventory
//   Step 4: What cuisine are you in the mood for?
//   Step 5: See your 3 recommendations
// ─────────────────────────────────────────────
function RecipeTab({inventory,prefs,onSelect}){
  const [step,setStep]               = useState(1);
  const [timeLimit,setTimeLimit]     = useState(null);
  const [servings,setServings]       = useState(2);
  const [selectedIds,setSelectedIds] = useState([]);
  const [cuisineMood,setCuisineMood] = useState(null);

  const availableItems = useMemo(()=>inventory.filter(i=>i.frac>0),[inventory]);

  function toggleItem(id){
    setSelectedIds(prev=>prev.includes(id)?prev.filter(x=>x!==id):[...prev,id]);
  }

  // Top-3 recipes: filter by time + cuisine mood, rank by ingredient overlap
  const top3 = useMemo(()=>{
    if(step!==5) return [];
    const selected = availableItems.filter(i=>selectedIds.includes(i.id));
    return RECIPES
      .filter(r=>{
        if(r.minutes>timeLimit) return false;
        if(cuisineMood && cuisineMood!=='any' && r.cuisine!==cuisineMood) return false;
        return true;
      })
      .map(r=>{
        let hits=0;
        r.ingredients.forEach(ing=>{
          if(selected.some(item=>nameMatch(item.name,ing.name))) hits++;
        });
        return {...r, hits, match:matchRecipe(r,inventory)};
      })
      .filter(r=>r.hits>0)
      .sort((a,b)=>b.hits-a.hits||b.match.pct-a.match.pct)
      .slice(0,3);
  },[step,selectedIds,cuisineMood,timeLimit,inventory,availableItems]);

  // ── Step 1: Time ──────────────────────────
  if(step===1){
    return(
      <div className="filter-section">
        <div style={{textAlign:'center',padding:'16px 0 8px'}}>
          <div style={{fontSize:'40px',marginBottom:'12px'}}>⏱️</div>
          <div style={{fontSize:'20px',fontWeight:800,color:'#1a5c34',marginBottom:'6px'}}>How much time do you have?</div>
          <div style={{fontSize:'14px',color:'#888',marginBottom:'24px'}}>I'll only recommend recipes you can actually finish.</div>
          <div className="time-grid">
            {TIMES.map(t=>(
              <div key={t.val} className="time-card" onClick={()=>{setTimeLimit(t.val);setStep(2);}}>
                <div className="time-card-icon">{t.icon}</div>
                <div className="time-card-label">{t.label}</div>
                <div className="time-card-sub">{t.sub}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    );
  }

  // ── Step 2: How many people? ───────────────
  if(step===2){
    const options=[
      {n:1,emoji:'🧍',label:'Just me'},
      {n:2,emoji:'👫',label:'2 people'},
      {n:3,emoji:'👨‍👩‍👦',label:'3 people'},
      {n:4,emoji:'👨‍👩‍👧‍👦',label:'4 people'},
      {n:5,emoji:'🏠',label:'5 people'},
      {n:6,emoji:'🎉',label:'6+ people'},
    ];
    return(
      <div className="filter-section">
        <div style={{textAlign:'center',padding:'16px 0 8px'}}>
          <div style={{fontSize:'40px',marginBottom:'12px'}}>👨‍🍳</div>
          <div style={{fontSize:'20px',fontWeight:800,color:'#1a5c34',marginBottom:'6px'}}>How many people are you cooking for?</div>
          <div style={{fontSize:'14px',color:'#888',marginBottom:'24px'}}>I'll automatically scale all ingredient amounts for you.</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'12px',maxWidth:'420px',margin:'0 auto'}}>
            {options.map(o=>(
              <div key={o.n} className="time-card"
                style={servings===o.n?{borderColor:'#2d8a4e',background:'#e8f0e9',borderWidth:'3px'}:{}}
                onClick={()=>{setServings(o.n);setStep(3);}}>
                <div className="time-card-icon">{o.emoji}</div>
                <div className="time-card-label" style={{fontSize:'14px'}}>{o.label}</div>
              </div>
            ))}
          </div>
          <button className="btn btn-secondary" style={{marginTop:'20px',padding:'8px 16px',fontSize:'13px'}} onClick={()=>setStep(1)}>← Change Time</button>
        </div>
      </div>
    );
  }

  // ── Step 3: Pick ingredients ───────────────
  if(step===3){
    const byLoc = [['fridge','🧊 Fridge'],['freezer','❄️ Freezer'],['pantry','🥫 Pantry']];
    return(
      <div>
        <div className="filter-section" style={{marginBottom:'16px'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'6px'}}>
            <div style={{fontWeight:800,fontSize:'16px',color:'#1a5c34'}}>🛒 What do you want to cook with?</div>
            <button className="btn btn-secondary" style={{padding:'6px 12px',fontSize:'12px'}} onClick={()=>setStep(2)}>← Back</button>
          </div>
          <div style={{fontSize:'13px',color:'#888',marginBottom:'16px'}}>
            Tap the ingredients you'd like to use. I'll find the 3 best recipes for them — I don't need to use all of them.
          </div>

          {byLoc.map(([loc,label])=>{
            const items=availableItems.filter(i=>i.location===loc);
            if(items.length===0) return null;
            return(
              <div key={loc} style={{marginBottom:'14px'}}>
                <div style={{fontSize:'12px',fontWeight:700,color:'#777',textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:'8px'}}>{label}</div>
                <div style={{display:'flex',flexWrap:'wrap',gap:'8px'}}>
                  {items.map(item=>{
                    const sel=selectedIds.includes(item.id);
                    return(
                      <div key={item.id}
                        onClick={()=>toggleItem(item.id)}
                        style={{
                          padding:'8px 14px',borderRadius:'20px',cursor:'pointer',fontSize:'13px',fontWeight:600,
                          border:`2px solid ${sel?'#2d8a4e':'#e0e0e0'}`,
                          background:sel?'#e8f0e9':'white',
                          color:sel?'#1a5c34':'#555',
                          transition:'all 0.15s',
                          display:'flex',alignItems:'center',gap:'6px'
                        }}>
                        {sel&&<span style={{fontSize:'11px'}}>✓</span>}
                        {item.name}
                        <span style={{fontSize:'11px',opacity:0.7}}>{item.frac===1?'full':`${Math.round(item.frac*100)}%`}</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}

          <div style={{borderTop:'1px solid #f0f0f0',paddingTop:'14px',marginTop:'6px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <div style={{fontSize:'13px',color:'#888'}}>
              {selectedIds.length===0?'No ingredients selected yet':''}
              {selectedIds.length>0&&<span style={{color:'#2d8a4e',fontWeight:700}}>{selectedIds.length} ingredient{selectedIds.length>1?'s':''} selected</span>}
            </div>
            <button
              className="btn btn-primary"
              disabled={selectedIds.length===0}
              onClick={()=>setStep(4)}
              style={{padding:'10px 22px'}}
            >
              Next →
            </button>
          </div>
        </div>
      </div>
    );
  }

  // ── Step 4: Cuisine mood ───────────────────
  if(step===4){
    return(
      <div>
        <div className="filter-section">
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'6px'}}>
            <div style={{fontWeight:800,fontSize:'16px',color:'#1a5c34'}}>🌍 What are you in the mood for?</div>
            <button className="btn btn-secondary" style={{padding:'6px 12px',fontSize:'12px'}} onClick={()=>setStep(3)}>← Back</button>
          </div>
          <div style={{fontSize:'13px',color:'#888',marginBottom:'20px'}}>Pick a cuisine — or let me surprise you.</div>

          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(130px,1fr))',gap:'10px'}}>
            {CUISINE_MOODS.map(c=>(
              <div key={c.id}
                onClick={()=>{setCuisineMood(c.id);setStep(5);}}
                style={{
                  background:'white',border:'2px solid #e8e8e8',borderRadius:'14px',
                  padding:'16px 10px',textAlign:'center',cursor:'pointer',
                  transition:'all 0.18s',
                }}
                onMouseEnter={e=>{e.currentTarget.style.borderColor='#2d8a4e';e.currentTarget.style.background='#f5fbf6';}}
                onMouseLeave={e=>{e.currentTarget.style.borderColor='#e8e8e8';e.currentTarget.style.background='white';}}>
                <div style={{fontSize:'32px',marginBottom:'8px'}}>{c.emoji}</div>
                <div style={{fontWeight:700,fontSize:'14px',color:'#333'}}>{c.label}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    );
  }

  // ── Step 5: 3 recommendations ─────────────
  const selectedNames = availableItems.filter(i=>selectedIds.includes(i.id)).map(i=>i.name);
  const cuisineLabel  = CUISINE_MOODS.find(c=>c.id===cuisineMood);
  return(
    <div>
      {/* Header bar */}
      <div className="filter-section" style={{marginBottom:'16px',padding:'14px 18px'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:'8px'}}>
          <div>
            <div style={{fontWeight:800,fontSize:'15px',color:'#1a5c34',marginBottom:'3px'}}>
              {cuisineLabel?.emoji} Your 3 {cuisineLabel?.id==='any'?'':cuisineLabel?.label+' '}Picks
            </div>
            <div style={{fontSize:'12px',color:'#888'}}>
              ⏱️ Up to {timeLimit} min · {selectedNames.slice(0,3).join(', ')}{selectedNames.length>3?` +${selectedNames.length-3} more`:''}
            </div>
          </div>
          <div style={{display:'flex',gap:'8px',flexWrap:'wrap'}}>
            <button className="btn btn-secondary" style={{padding:'7px 12px',fontSize:'12px'}} onClick={()=>setStep(4)}>← Cuisine</button>
            <button className="btn btn-secondary" style={{padding:'7px 12px',fontSize:'12px'}} onClick={()=>{setStep(1);setSelectedIds([]);setTimeLimit(null);setCuisineMood(null);setServings(2);}}>Start Over</button>
          </div>
        </div>
      </div>

      {top3.length===0?(
        <div className="empty">
          <div className="empty-icon">🤔</div>
          <div className="empty-text">
            No {cuisineLabel?.id!=='any'?cuisineLabel?.label+' ':''}recipes matched those ingredients in {timeLimit} min.
          </div>
          <div style={{display:'flex',gap:'10px',justifyContent:'center',marginTop:'16px',flexWrap:'wrap'}}>
            <button className="btn btn-primary" onClick={()=>setStep(4)}>Try a Different Cuisine</button>
            <button className="btn btn-secondary" onClick={()=>setStep(3)}>Change Ingredients</button>
          </div>
        </div>
      ):(
        <div style={{display:'flex',flexDirection:'column',gap:'16px'}}>
          {top3.map((r,idx)=>(
            <RecipeCard key={r.id} recipe={r} rank={idx+1} selectedNames={selectedNames} servings={servings} onClick={()=>onSelect({...r,servings})} />
          ))}
          {top3.length<3&&(
            <div style={{textAlign:'center',fontSize:'13px',color:'#aaa',padding:'8px'}}>
              Only {top3.length} recipe{top3.length>1?'s':''} matched — try a different cuisine or more ingredients.
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function RecipeCard({recipe,rank,selectedNames,servings,onClick}){
  const {match}=recipe;
  const hits=recipe.hits||0;
  const canMake=match.pct===1;
  const rankColors=['#f4a226','#2d8a4e','#8e44ad'];
  const rankLabels=['#1 Pick','#2 Pick','#3 Pick'];

  // Which selected ingredients does this recipe use?
  const usedIngredients = recipe.ingredients
    .filter(ing=>selectedNames&&selectedNames.some(n=>nameMatch(n,ing.name)))
    .map(ing=>ing.name);

  return(
    <div style={{background:'white',borderRadius:'14px',padding:'18px',cursor:'pointer',border:`2px solid ${rankColors[(rank||1)-1]}`,boxShadow:'0 2px 10px rgba(0,0,0,0.08)',transition:'all 0.2s'}}
      onClick={onClick}
      onMouseEnter={e=>e.currentTarget.style.transform='translateY(-2px)'}
      onMouseLeave={e=>e.currentTarget.style.transform='translateY(0)'}>
      <div style={{display:'flex',alignItems:'flex-start',gap:'14px'}}>
        {/* Rank badge + emoji */}
        <div style={{textAlign:'center',flexShrink:0}}>
          <div style={{background:rankColors[(rank||1)-1],color:'white',borderRadius:'8px',padding:'3px 8px',fontSize:'11px',fontWeight:800,marginBottom:'6px'}}>{rankLabels[(rank||1)-1]}</div>
          <div style={{fontSize:'44px',lineHeight:1}}>{recipe.emoji}</div>
        </div>

        {/* Info */}
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:800,fontSize:'16px',marginBottom:'8px'}}>{recipe.name}</div>
          <div style={{display:'flex',gap:'6px',flexWrap:'wrap',marginBottom:'10px'}}>
            <span className="tag tag-b">{recipe.cuisine}</span>
            <span className="tag tag-g">⏱️ {recipe.minutes} min</span>
            {recipe.flavor.slice(0,2).map(f=><span key={f} className={`tag ${f==='spicy'?'tag-r':f==='sweet'?'tag-p':f==='umami'?'tag-t':'tag-o'}`}>{f}</span>)}
          </div>

          {/* Ingredient overlap */}
          <div style={{fontSize:'12px',marginBottom:'6px'}}>
            <span style={{fontWeight:700,color:'#2d8a4e'}}>Uses {hits} of your selected ingredient{hits!==1?'s':''}: </span>
            <span style={{color:'#555'}}>{usedIngredients.slice(0,4).join(', ')}{usedIngredients.length>4?` +${usedIngredients.length-4} more`:''}</span>
          </div>

          {servings&&servings!==2&&<div style={{fontSize:'12px',color:'#8e44ad',fontWeight:700,marginBottom:'4px'}}>
            👥 Scaled for {servings} {servings===1?'person':'people'} · {servings>2?`×${(servings/2).toFixed(1).replace('.0','')} all amounts`:'use half all amounts'}
          </div>}
          {/* Full inventory match */}
          <div style={{fontSize:'12px',color:'#999',display:'flex',alignItems:'center',gap:'5px'}}>
            <span style={{width:7,height:7,borderRadius:'50%',background:canMake?'#2d8a4e':'#f4a226',display:'inline-block',flexShrink:0}}/>
            {canMake?'✅ You have all ingredients!':match.missing.length>0?`May need: ${match.missing.slice(0,3).join(', ')}`:``}
          </div>
        </div>

        {/* Arrow */}
        <div style={{fontSize:'20px',color:'#ccc',flexShrink:0,alignSelf:'center'}}>›</div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────
// RECIPE DETAIL MODAL
// ─────────────────────────────────────────────
function RecipeDetailModal({recipe,inventory,onCook,onClose}){
  const match=matchRecipe(recipe,inventory);
  const servings=recipe.servings||2;
  const scale=servings/2;
  const scaleNote=scale===1?null:scale>1?`×${scale.toFixed(1).replace('.0','')} all ingredient amounts — scaled for ${servings} people`:`Use half of all ingredient amounts — scaled for 1 person`;
  return(
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <button className="modal-close" onClick={onClose}>✕</button>
        <div className="rd-header">
          <div className="rd-emoji">{recipe.emoji}</div>
          <div className="rd-info">
            <h2>{recipe.name}</h2>
            <div className="rd-tags">
              <span className="tag tag-b">{recipe.cuisine}</span>
              <span className="tag tag-g">⏱️ {recipe.minutes} min</span>
              <span className="tag tag-o">👨‍🍳 Beginner</span>
              {recipe.flavor.map(f=><span key={f} className={`tag ${f==='spicy'?'tag-r':f==='sweet'?'tag-p':f==='umami'?'tag-t':'tag-g'}`}>{f}</span>)}
            </div>
          </div>
        </div>
        {scaleNote&&<div style={{background:'#f3e8ff',borderRadius:'10px',padding:'11px 14px',fontSize:'13px',color:'#6d28d9',fontWeight:700,marginBottom:'16px'}}>👥 {scaleNote}</div>}
        <div className="rd-section">
          <div className="rd-section-title">🛒 Ingredients <span style={{fontWeight:400,color:'#999',fontSize:'11px',textTransform:'none',letterSpacing:0}}>base recipe serves 2{servings!==2?` · scaled for ${servings}`:''}</span></div>
          <ul className="ing-list">
            {recipe.ingredients.map((ing,i)=>{
              const inInv=inventory.some(item=>nameMatch(item.name,ing.name)&&item.frac>0);
              return(
                <li key={i} className="ing-item">
                  <span className={`ing-dot ${inInv?'have':'unknown'}`}/>
                  <span><strong>{ing.qty}</strong> {ing.name}</span>
                  {inInv&&<span style={{marginLeft:'auto',fontSize:'11px',color:'#2d8a4e',fontWeight:700}}>✓ have it</span>}
                </li>
              );
            })}
          </ul>
          {match.missing.length>0&&<div className="missing-note">⚠️ May be short on: {match.missing.join(', ')}. Check your pantry — you might have more than tracked!</div>}
        </div>
        <div className="rd-section">
          <div className="rd-section-title">👨‍🍳 Step-by-Step Instructions</div>
          <ol className="step-list">
            {recipe.instructions.map((step,i)=>(
              <li key={i} className="step-item">
                <span className="step-num">{i+1}</span>
                <span className="step-text">{step}</span>
              </li>
            ))}
          </ol>
        </div>
        <button className="btn btn-primary btn-full" onClick={()=>onCook(recipe)}>
          🍽️ I Cooked This! — Deduct from Inventory
        </button>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────
// HISTORY TAB
// ─────────────────────────────────────────────
function HistoryTab({history}){
  if(history.length===0) return <div className="empty"><div className="empty-icon">📖</div><div className="empty-text">No history yet. Make your first recipe!</div></div>;
  const byMonth={};
  history.forEach(h=>{ if(!byMonth[h.month]) byMonth[h.month]=[]; byMonth[h.month].push(h); });
  return(
    <div>
      {Object.entries(byMonth).sort(([a],[b])=>b.localeCompare(a)).map(([month,entries])=>(
        <div key={month} style={{background:'white',borderRadius:'12px',marginBottom:'16px',overflow:'hidden',boxShadow:'0 2px 8px rgba(0,0,0,0.07)'}}>
          <div style={{background:'#f2f8f3',padding:'12px 20px',borderBottom:'1px solid #e8ede9',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <div style={{fontWeight:800,fontSize:'15px',color:'#1a5c34'}}>{formatMonth(month)}</div>
            <span className="badge badge-green">🍽️ {entries.length} meal{entries.length>1?'s':''}</span>
          </div>
          {entries.map(h=>(
            <div key={h.id} className="history-item">
              <div className="hi-emoji">{h.emoji}</div>
              <div className="hi-info">
                <div className="hi-name">{h.name}</div>
                <div className="hi-date">{formatDate(h.date)}</div>
                {h.challenge&&<div className="hi-month">⭐ Monthly Challenge Pick</div>}
              </div>
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

// ─────────────────────────────────────────────
// ALERTS MODAL
// ─────────────────────────────────────────────
function AlertsModal({items,onClose}){
  return(
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <button className="modal-close" onClick={onClose}>✕</button>
        <h2>🔔 Stock Alerts</h2>
        {items.length===0?(
          <div className="empty" style={{padding:'24px 0'}}><div className="empty-icon">✅</div><div className="empty-text">Everything is well stocked!</div></div>
        ):(
          <div>
            <p style={{fontSize:'14px',color:'#666',marginBottom:'16px'}}>These items are at 25% or less — consider restocking soon.</p>
            {items.map(item=>(
              <div key={item.id} style={{display:'flex',alignItems:'center',gap:'14px',padding:'14px',borderBottom:'1px solid #f5f5f5'}}>
                <div style={{fontSize:'24px'}}>{item.frac<=0.10?'🚨':'⚠️'}</div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:'15px'}}>{item.name}</div>
                  <div style={{fontSize:'12px',color:'#888'}}>{fracLabel(item.frac)} {item.container} left · {item.location}</div>
                  <div className="prog-bar" style={{marginTop:'6px'}}><div className="prog-fill" style={{width:`${item.frac*100}%`,background:stockColor(item.frac)}}/></div>
                </div>
                <div style={{fontWeight:800,color:stockColor(item.frac),fontSize:'15px'}}>{Math.round(item.frac*100)}%</div>
              </div>
            ))}
          </div>
        )}
        <button className="btn btn-secondary" style={{width:'100%',marginTop:'16px'}} onClick={onClose}>Close</button>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────
// MONTHLY CHALLENGE MODAL
// ─────────────────────────────────────────────
function MonthlyChallengeModal({inventory,history,onCook,onClose}){
  const [selected,setSelected]=useState(null);
  const month=getCurrentMonth();
  const done=history.some(h=>h.month===month&&h.challenge);
  if(done){
    const pick=history.find(h=>h.month===month&&h.challenge);
    return(
      <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
        <div className="modal">
          <button className="modal-close" onClick={onClose}>✕</button>
          <div className="challenge-header"><h3>⭐ Monthly Challenge</h3><p>{formatMonth(month)}</p></div>
          <div style={{textAlign:'center',padding:'20px'}}><div style={{fontSize:'60px',marginBottom:'12px'}}>{pick.emoji}</div><div style={{fontWeight:800,fontSize:'17px',marginBottom:'6px'}}>Challenge complete!</div><div style={{fontSize:'14px',color:'#666'}}>{pick.name}</div><div style={{fontSize:'12px',color:'#999',marginTop:'6px'}}>{formatDate(pick.date)}</div></div>
          <button className="btn btn-secondary btn-full" onClick={onClose}>Close</button>
        </div>
      </div>
    );
  }
  const candidates=RECIPES.map(r=>({...r,match:matchRecipe(r,inventory)})).sort((a,b)=>b.match.pct-a.match.pct);
  const picks=[];const used=new Set();
  for(const r of candidates){ if(picks.length>=3) break; if(!used.has(r.cuisine)){picks.push(r);used.add(r.cuisine);} }
  while(picks.length<3&&picks.length<candidates.length){const r=candidates[picks.length];if(!picks.find(p=>p.id===r.id))picks.push(r);}
  return(
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <button className="modal-close" onClick={onClose}>✕</button>
        <div className="challenge-header"><h3>⭐ Monthly Challenge</h3><p>{formatMonth(month)} — Pick one recipe to cook this month!</p></div>
        {picks.map(r=>(
          <div key={r.id} className={`challenge-option ${selected===r.id?'selected':''}`} onClick={()=>setSelected(r.id)}>
            <div className="co-emoji">{r.emoji}</div>
            <div className="co-info"><div className="co-name">{r.name}</div><div className="co-meta">{r.cuisine} · ⏱️ {r.minutes} min · {r.match.pct===1?'✅ Have everything':r.match.missing.length>0?`⚠️ Missing: ${r.match.missing.slice(0,2).join(', ')}`:''}</div></div>
            {selected===r.id&&<span style={{fontSize:'22px'}}>✅</span>}
          </div>
        ))}
        <button className={`btn ${selected?'btn-orange':'btn-secondary'} btn-full`} disabled={!selected} onClick={()=>{ const r=picks.find(x=>x.id===selected); if(r) onCook(r); }}>
          {selected?`🍽️ Cook "${picks.find(r=>r.id===selected)?.name}"!`:'Select a recipe first'}
        </button>
        <button className="btn btn-secondary" style={{width:'100%',marginTop:'8px'}} onClick={onClose}>Skip for now</button>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────
// SETTINGS MODAL
// ─────────────────────────────────────────────
function SettingsModal({prefs,apiKey,onSave,onClose}){
  const [data,setData]=useState({...prefs});
  const [key,setKey]=useState(apiKey);
  const [showKey,setShowKey]=useState(false);
  const cuisineOpts=['🇺🇸 American','🇮🇹 Italian','🇲🇽 Mexican','🇯🇵 Asian','🇬🇷 Mediterranean','🌍 All cuisines'];
  function toggle(field,val){ setData(d=>{const a=d[field];return{...d,[field]:a.includes(val)?a.filter(x=>x!==val):[...a,val]};}); }
  return(
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <button className="modal-close" onClick={onClose}>✕</button>
        <h2 style={{marginBottom:'20px'}}>⚙️ Settings</h2>

        <div className="form-group">
          <label className="form-label">🤖 Claude API Key <span style={{fontWeight:400,color:'#999'}}>(for photo scanning)</span></label>
          <div style={{display:'flex',gap:'8px'}}>
            <input className="form-input" type={showKey?'text':'password'} value={key} onChange={e=>setKey(e.target.value)} placeholder="sk-ant-..." style={{flex:1}} />
            <button className="btn btn-secondary" style={{padding:'10px 14px',flexShrink:0}} onClick={()=>setShowKey(s=>!s)}>{showKey?'Hide':'Show'}</button>
          </div>
          <div className="form-hint">Get your key at <strong>console.anthropic.com</strong> — stored locally on your device only. Enables AI photo scanning in inventory.</div>
        </div>

        <div className="form-group">
          <label className="form-label">Household Size</label>
          <div className="scale-row">{[1,2,3,4,'5+'].map(n=><div key={n} className={`scale-btn ${data.householdSize===n?'sel':''}`} onClick={()=>setData(d=>({...d,householdSize:n}))}>{n}</div>)}</div>
        </div>
        <div className="form-group">
          <label className="form-label">Favorite Cuisines</label>
          <div className="check-grid">{cuisineOpts.map(c=><div key={c} className={`check-item ${data.cuisines.includes(c)?'sel':''}`} onClick={()=>toggle('cuisines',c)}>{data.cuisines.includes(c)?'✅':'⬜'} {c}</div>)}</div>
        </div>
        <div className="form-group">
          <label className="form-label">Spice Level</label>
          <div className="scale-row">{[['mild','😌 Mild'],['medium','🙂 Medium'],['spicy','🌶️ Spicy'],['very_spicy','🔥 Hot']].map(([v,l])=><div key={v} className={`scale-btn ${data.spiceLevel===v?'sel':''}`} onClick={()=>setData(d=>({...d,spiceLevel:v}))}>{l}</div>)}</div>
        </div>
        <div style={{display:'flex',gap:'10px',marginTop:'8px'}}>
          <button className="btn btn-primary" style={{flex:1}} onClick={()=>onSave(data,key)}>Save Changes</button>
          <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
